[project]
name = "job-funnel"
version = "0.1.0"
description = "Deterministic job-search funnel: ingest, local-embedding matching, cover letter drafts"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "alembic>=1.18.5",
    "fastembed>=0.8.0",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.9.1",
    "pydantic-graph>=2.9.1",
    "pydantic-settings>=2.14.2",
    "sqladmin>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "typer>=0.26.8",
    "uvicorn>=0.51.0",
]

[project.scripts]
funnel = "funnel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "W", "F", "I", "N", "UP", "B"]
"tests/*" = ["B008"]
# sqladmin's ModelView API is plain class attributes (column_list = [...]); RUF012 would
# have us wrap the library's own documented interface in ClassVar.
"src/funnel/admin.py" = ["RUF012"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic, SQLAlchemy and Typer resolve annotations at runtime. Hiding these imports
# behind TYPE_CHECKING would break model and CLI construction, so exempt their classes.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.lint.isort]
known-first-party = ["funnel"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "googleapiclient.*", "google_auth_oauthlib.*", "sqladmin.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need a live database or network",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]
